# cue-skills — repo-level DSH bundle.
#
# This is the repository-root bundle entry, so that a single command wires the
# whole Cue surface into any DeepSeek Harness profile:
#
#   dsh plugin --profile web add github:sensedeal/cue-skills#<commit>
#
# It mounts two capabilities as one `insert` list:
#   * mcp-omni      -> the audited Cue Omni Reader MCP server  (mcp__omni__*)
#   * mcp-cue_*     -> Cue public data MCP services            (mcp__cue_*)
#
# Requirements: Node >= 20.12 and CUE_API_KEY in the environment (set it in
# $DSH_HOME/.env or export it before launching dsh). Secrets never go in this
# file; local reads are bounded by OMNI_ALLOWED_ROOTS.
#
# The optional SSRF/consent hardening lives in its own opt-in bundle
# (`dsh/cue-omni-reader-guard/`): it fails closed on local files until an
# explicit root is authorized, so it is deliberately NOT part of this default
# repo bundle.
#
# The Bridge version is pinned (never an implicit `latest`).

- insert:
    - id: mcp-omni
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: omni
        transport: stdio
        command: npx
        args: ['-y', '@cueai/omni-reader-mcp@1.8.6']
        cwd: !!js process.cwd()
        env:
          CUE_API_KEY: !!js process.env.CUE_API_KEY
          # Configurable, never hardcoded: explicit root wins, else the dsh cwd.
          OMNI_ALLOWED_ROOTS: !!js 'process.env.OMNI_ALLOWED_ROOTS || process.cwd()'
    - id: mcp-cue_regulatory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cue_regulatory
        transport: streamable-http
        url: https://mcp.cuecue.cn/api/regulatory/mcp/
        headers:
          Authorization: !!js '`Bearer ${process.env.CUE_API_KEY}`'
          Accept: "application/json, text/event-stream"
    - id: mcp-cue_regulatory_cn
