# @cueai/dsh-cue-data-mcp — expose Cue's public data MCP services as DSH tools.
#
# One `@deepseek-ai/dsh-mcp-client` instance per live data domain (streamable-http);
# the model sees `mcp__cue_<domain>__<tool>`. URLs are Cue's own fixed endpoints,
# so no SSRF guard is needed — only `CUE_API_KEY` is required (via env).
- insert:
    - id: mcp-cue_regulatory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cue_regulatory
        transport: streamable-http
        url: https://mcp.cuecue.cn/api/regulatory/mcp/
        headers:
          Authorization: !!js '`Bearer ${process.env.CUE_API_KEY}`'
          Accept: "application/json, text/event-stream"
    - id: mcp-cue_regulatory_cn
      name: '@deepseek-ai/dsh-mcp-client'
